services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetry_triage
      POSTGRES_USER: ${TELEMETRY_DOCKER_DB_USER:?Set TELEMETRY_DOCKER_DB_USER in .env}
      POSTGRES_PASSWORD: ${TELEMETRY_DOCKER_DB_PASSWORD:?Set TELEMETRY_DOCKER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - telemetry_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEMETRY_DB_URL: jdbc:postgresql://postgres:5432/telemetry_triage
      TELEMETRY_DB_USERNAME: ${TELEMETRY_DOCKER_DB_USER:?Set TELEMETRY_DOCKER_DB_USER in .env}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DOCKER_DB_PASSWORD:?Set TELEMETRY_DOCKER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  telemetry_postgres_data:
